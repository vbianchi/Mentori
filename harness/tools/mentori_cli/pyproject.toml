[project]
name = "mentori-cli"
version = "0.1.0"
description = "A command line tool to run the Mentori method (the paper's code, unchanged) on a lab's own papers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The paper's code as it is: experiments/mentori, installed for its dependencies only (it is not a package);
    # mentori_cli puts experiments/mentori and the repository on sys.path at run time.
    "mentori",
]

[project.scripts]
mentori-cli = "mentori_cli.cli:main"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.uv.sources]
mentori = { path = "../../experiments/mentori", package = false }

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
