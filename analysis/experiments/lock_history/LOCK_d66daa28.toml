# LOCK: the one set of settings for every model call in the revised paper's experiments.
# Every script reads its settings from this file and sets none of its own. Nothing is cut. A model that
# fails because its input or answer is too long shows that failure in its record. An experiment varies
# only the one factor its row in experiments/LIST.md names. Decisions behind each value: README.md.

status = "agreed"              # Valerio, 14 October (D53); a model without a digest in [models] cannot run

[server]
ollama_version = "0.40.2"      # the Studio's keg; the same binary on every Mac
binary_sha256 = { macos = "af75d4a611db7df0cd69e643bc51e9994d1006d61032b270fc90503118de892e", beelink = "9eaec399fd941073f8ddfbd56e0447f77fca5c006b26b8b1874a7fb12719b2a0" }   # checked by experiments/runner/check_server.py (R1)
num_parallel = 1               # one request per server
flash_attention = true
kv_cache_type = "q8_0"
keep_alive = "24h"
truncate = false               # a prompt longer than the context is an error, never cut in half
shift = false                  # a full context stops the answer ("length"), never drops earlier text
runner = "llama.cpp"           # GGUF models only; no MLX model in any run (its runner does not log or
                               # honour these settings, and qwen3.8:27b-mlx did not repeat itself at temperature 0)

[generation]
num_ctx = 131072               # largest context gemma3, gpt-oss and deepseek-r1 support
num_predict = -1               # no output limit; the context bounds every answer
num_batch = 1024
seed = "draw"                  # the draw number (1, 2, 3)
candidate_seed = "draw * 1000 + candidate"   # Q32 (D68): candidate k (1 to 999) of an n-candidate step inside draw d
                               # (code generation's best-of-3 sends one prompt 3 times) sends seed d * 1000 + k, so its
                               # candidates differ; a call with no candidate number sends d. d is 1 to 999, so no two calls
                               # of a run share a seed. Instruments take no candidate.
retry_seed = "seed + 1000000 * retry"   # D81 (Q136): an Ollama generator call retried after a transient error (D80 V1,
                               # Q138: a tool-call parse error, a stall, an HTTP 500, a dropped connection) sends its own seed
                               # (the draw d, or d * 1000 + k for candidate k) + 1,000,000 * r, r (1 to 3) the step's running
                               # count of transient retries (Mentori's counter); a new sample, as the submitted client's unseeded
                               # retry was. Every draw and candidate seed is below 1,000,000, so no retry seed equals one of
                               # them. Instruments and Gemini are never retried.
think = "off"                  # instruments ([judge], [scorers]); generators follow [thinking] (D66)
timeout = "none"               # calls are streamed; no limit before the first token
stall_s = 600                  # after the first token, 600 s without a new one = recorded as stalled (Q2, 15 October)

[judge]
model = "devstral-small-2:24b"
second_model = "qwen3.8:27b"   # D85 (Valerio, 17 October, Q176): the second judge; devstral (model) stays the main judge. Both
                               # come from the last calibration, S404/S405 (notes/DECISIONS_2026-10-13.md:11, composite
                               # qwen3.8:27b-mlx 0.628, devstral 0.576). That score is the MLX build's; this GGUF build
                               # ([models]) has not judged yet, and D85 checks it repeats its scores on the 107
                               # calibration answers before it judges. Both judges send this section's settings, as
                               # instruments: temperature 0, think false, seed none, num_predict 16384, the rest as
                               # [generation]; what each Modelfile adds is in not_sent. qwen3.8 writes no date into the
                               # prompt, so it needs no [date] row (its template is {{ .Prompt }}, RENDERER qwen3.8,
                               # /api/show on the Beelink, 17 October; the renderer in Ollama v0.40.2,
                               # model/renderers/qwen35.go, imports no time package)
temperature = 0                # every other setting as [generation]; S440 (devstral only): 107 of 107 scores equal
seed = "none"
num_predict = 16384            # O3 (15 October): judge and scorer replies are short (judge about 150 tokens, RAGAS under
                               # 1,000); a reply that reaches 16,384 is a runaway loop, recorded as "length" and never used
not_sent = "top_k, top_p, min_p, repeat_penalty, presence_penalty: the judge's Modelfile value applies where it sets one, else Ollama's default. devstral sets none of them (its Modelfile sets only temperature 0.15, which the judge overrides; /api/show on the Beelink, 17 October), so Ollama's defaults apply (40, 0.9, 0.0, 1.0 = off; docs.ollama.com/modelfile, 15 October; presence_penalty 0, api/types.go at v0.40.2). qwen3.8:27b sets top_k 20, top_p 0.95, min_p 0, repeat_penalty 1, presence_penalty 0 (/api/show on the Beelink, 17 October; D85). At temperature 0 the most likely token is always taken, and these only trim the candidates, so they do not change what the judge writes (Q1, 15 October). Also not sent: draft_num_predict, a load-time setting for speculative decoding (Ollama's default 4 for every model, api/types.go:1199 at v0.40.2; qwen3.8's Modelfile also sets 4, and its weights carry one multi-token prediction layer, qwen35.nextn_predict_layers 1). Whether Ollama drafts with it for qwen3.8, and whether that changes a score, is not measured: D85's 107-answer check would show it."

[scorers]
model = "devstral-small-2:24b" # RAGAS and RAGChecker, at the judge's settings
ragchecker_claims_per_call = 1
embedding = "bge-m3:latest"    # the only encoder scorers call (RAGAS answer relevancy)

[retrieval]
# Mentori's two in-process encoders (sentence-transformers, outside Ollama; Q20, D68; fix_design/calls.md B5). Each is to
# load the snapshot named here from the local Hugging Face cache and never download, as Mentori's copy now does (the B5
# fix: experiments/mentori/backend/retrieval/embeddings.py and reranker.py:58-59 pass revision and local_files_only
# from these rows). revision: refs/main of
# ~/.cache/huggingface/hub/models--BAAI--<name>, read on the Studio and the laptop on 15 October, the same on both.
# device: cpu (D69, Q37 of 15 October), as every banked arm ran (MENTORI_EMBED_DEVICE=cpu, scripts/S141_campaign.py:261) and as the index was
# embedded (scripts/S437_depth_regen.py:362, O9). Unset, embeddings.py:116-127 picks mps on Apple silicon and the
# reranker leaves the device to sentence-transformers, which also picks mps; neither machine's shell profile sets it.
embedding = { hf_repo = "BAAI/bge-m3", revision = "5617a9f61b028005a4858fdac845db406aefb181", local_files_only = true, device = "cpu" }   # D69 (Q37); embeddings.py:132; the snapshot holds pytorch_model.bin; the cache also holds refs/pr/130 (9a0624b8, model.safetensors only)
reranker  = { hf_repo = "BAAI/bge-reranker-v2-m3", revision = "953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e", local_files_only = true, device = "cpu" }   # reranker.py:34, its default model

[sampling]
# Each model's maker's values, the same for that model in every experiment and role. Source order: the
# maker's words or code, else the maker's generation_config.json, else the transformers library default
# (top_k 50, top_p 1.0, temperature 1.0, no min_p, repetition 1.0). Presence and frequency penalties
# are 0 unless the maker sets them. think here is the setting for thinking OFF: off, the lowest level, omit (no
# thinking mode) or always (cannot be turned off). Thinking at the maker's default: [sampling.thinking_on].
[sampling.models]
"gemma3:27b"              = { temperature = 1.0,  top_p = 0.95, top_k = 64, min_p = 0.0, repeat_penalty = 1.0,  presence_penalty = 0.0, think = "omit" }   # Google config file; temperature library default
"glm-4.7-flash"           = { temperature = 1.0,  top_p = 0.95, top_k = 50, min_p = 0.0, repeat_penalty = 1.0,  presence_penalty = 0.0, think = "off" }    # Z.ai card; top_k library default
"nemotron-3-nano:30b"     = { temperature = 0.0,  top_p = 1.0,  top_k = 50, min_p = 0.0, repeat_penalty = 1.0,  presence_penalty = 0.0, think = "off" }    # NVIDIA card: greedy for reasoning off
"devstral-small-2:24b"    = { temperature = 0.15, top_p = 1.0,  top_k = 50, min_p = 0.0, repeat_penalty = 1.0,  presence_penalty = 0.0, think = "omit" }   # Mistral config file; as judge, temperature 0
"llama3:8b"               = { temperature = 0.6,  top_p = 0.9,  top_k = 0,  min_p = 0.0, repeat_penalty = 1.0,  presence_penalty = 0.0, think = "omit" }   # Meta reference code (no top-k)
"gpt-oss:20b"             = { temperature = 1.0,  top_p = 1.0,  top_k = 0,  min_p = 0.0, repeat_penalty = 1.0,  presence_penalty = 0.0, think = "low" }    # OpenAI README and reference sampler (no top-k)
"gpt-oss:120b"            = { temperature = 1.0,  top_p = 1.0,  top_k = 0,  min_p = 0.0, repeat_penalty = 1.0,  presence_penalty = 0.0, think = "low" }    # as gpt-oss:20b
"qwen3-coder:30b"         = { temperature = 0.7,  top_p = 0.8,  top_k = 20, min_p = 0.0, repeat_penalty = 1.05, presence_penalty = 0.0, think = "omit" }   # Qwen card = config file
"qwen3-coder-next:q4_K_M" = { temperature = 1.0,  top_p = 0.95, top_k = 40, min_p = 0.0, repeat_penalty = 1.0,  presence_penalty = 0.0, think = "omit" }   # Qwen card = config file
"qwen3.5:35b"             = { temperature = 0.7,  top_p = 0.8,  top_k = 20, min_p = 0.0, repeat_penalty = 1.0,  presence_penalty = 1.5, think = "off" }    # Qwen card, non-thinking general tasks
"qwen3.5:122b"            = { temperature = 0.7,  top_p = 0.8,  top_k = 20, min_p = 0.0, repeat_penalty = 1.0,  presence_penalty = 1.5, think = "off" }    # Qwen card, non-thinking general tasks
"deepseek-r1:70b"         = { temperature = 0.6,  top_p = 0.95, top_k = 50, min_p = 0.0, repeat_penalty = 1.0,  presence_penalty = 0.0, think = "always" } # DeepSeek card; top_k library default; no system prompt
"olmo-3"                  = { temperature = 0.6,  top_p = 0.95, top_k = 50, min_p = 0.0, repeat_penalty = 1.0,  presence_penalty = 0.0, think = "always" } # AllenAI card and its example code
"olmo-3.1:32b-think"      = { temperature = 0.6,  top_p = 0.95, top_k = 50, min_p = 0.0, repeat_penalty = 1.0,  presence_penalty = 0.0, think = "always" } # AllenAI card (huggingface.co/allenai/Olmo-3.1-32B-Think, read 16 October): temperature 0.6, top_p 0.95; top_k library default; the Think model (D78)
"claude-haiku-4-5"        = { temperature = 1.0,  think = "omit" }   # Anthropic default; top_p and top_k not sent; model claude-haiku-4-5-20251001

# Thinking at the maker's default, the setting of every generator (D66): as above, except. The rows are the makers'
# thinking-mode values; Qwen3.5 and GLM give coding values here (Figure 6), and give other values for general
# tasks, to be settled before any of them generates answers to questions (only the "if time" rows would).
[sampling.thinking_on]
"glm-4.7-flash"       = { temperature = 0.7, top_p = 1.0 }                                       # Z.ai card, coding settings
"qwen3.5:35b"         = { temperature = 0.6, top_p = 0.95, top_k = 20, presence_penalty = 0.0 }  # Qwen card, precise coding
"qwen3.5:122b"        = { temperature = 0.6, top_p = 0.95, top_k = 20, presence_penalty = 0.0 }  # Qwen card, precise coding
"nemotron-3-nano:30b" = { temperature = 1.0, top_p = 1.0 }                                       # NVIDIA card, reasoning on
"gpt-oss:20b"         = { think = "medium" }                                                     # OpenAI's default level
"gpt-oss:120b"        = { think = "medium" }                                                     # OpenAI's default level

# Thinking levels, where the level is the row's factor (code generation ran gpt-oss:20b at low, medium, high and
# Ollama's default; D56). Sampling stays the model's row above.
[sampling.thinking_levels]
"gpt-oss:20b" = ["low", "medium", "high"]

[gemini]
temperature = 1.0              # Google: keep Gemini 3 at its default 1.0
top_p = 0.95                   # API default
top_k = 64                     # API default
max_output_tokens = 65536      # the model maximum; it counts thinking and answer together
seed = "draw"                  # the draw number, as [generation]; candidates: [generation] candidate_seed
thinking_off = { "gemini-3-flash-preview" = "minimal", "gemini-2.5-pro" = 128 }   # the lowest each allows
# thinking at the default (every generator, D66): no thinking setting is sent, so each runs at Google's default (gemini-3-flash-preview "On (high)",
# gemini-2.5-pro "On", both dynamic: ai.google.dev/gemini-api/docs/thinking, 14 October)
# presence and frequency penalties are not sent (Google publishes no value for them)

[thinking]
# One rule per role (D66, Valerio, 15 October; replaces the per-figure rule of D59).
# The system under test runs as a reader would run it, at its maker's default: every generator, and Mentori's own
# components (the verified-pass verifier, analyser, planner, supervisor, distiller, synthesiser, RLM sub-calls).
# Temperature and sampling from [sampling.models], thinking as the maker ships it ([sampling.thinking_on]; gpt-oss
# medium; Gemini Google's dynamic default, nothing sent; models without thinking unchanged). Its randomness is
# measured with draws, not removed.
# Instruments run at temperature 0 with thinking off, as they were validated: the judge, RAGAS, RAGChecker and any
# other scorer ([judge], [scorers]).
# Thinking is varied only where it is the row's factor (Figure 6: off and default per model, gpt-oss:20b also low
# and high). Off is think false, or the lowest level where a model cannot turn it off (gpt-oss low,
# gemini-3-flash-preview minimal, gemini-2.5-pro 128; deepseek-r1 and olmo-3 always think).
generator = "default"
instrument = "off"

[anthropic]
model_id = "claude-haiku-4-5-20251001"   # the dated snapshot the alias claude-haiku-4-5 resolves to (same page)
max_tokens = 64000             # claude-haiku-4-5-20251001's maximum ("Max output: 64K tokens",
                               # platform.claude.com/docs/en/models/haiku-4-5/overview, 14 October); retirement
                               # "not sooner than October 15, 2026"

[date]
# These models' Ollama templates write today's date into the prompt, so the same call reads different text on
# different days. Each runs with the date fixed at 10 October 2026, in every role (Q31 of 10 October; D55).
fixed = "2026-10-10"
system_prompt = { "devstral-small-2:24b" = "data/judge_system_prompts/devstral-small-2_24b.date-2026-10-10.txt" }
model_copy = { "gpt-oss:20b" = "gpt-oss:20b-date20261010", "gpt-oss:120b" = "gpt-oss:120b-date20261010" }
# devstral: its built-in system prompt, sent with the date fixed. gpt-oss puts the date in a header a system
# prompt cannot replace, so it runs as a copy whose template has the date fixed (same weights; Modelfiles in
# data/judge_system_prompts/).

[exceptions]
# Models whose maximum context is below num_ctx run at their own maximum and stay out of the main comparison.
"llama3:8b" = { num_ctx = 8192 }
"olmo-3" = { num_ctx = 65536 }
"olmo-3.1:32b-think" = { num_ctx = 65536 }   # olmo3.context_length 65536 (/api/show on the Beelink, 16 October); an exact key, since the family lookup gives "olmo-3.1" (audit F14)

[models]
# Ollama tag, the manifest digest it must have, and the machines that hold it with that digest (read from
# each server's /api/tags, 14 October). A run refuses a model whose digest differs from this list.
"gemma3:27b"              = { digest = "8dda00f4f636a0ae610bf6eae134d59de477256140276ec847510ce898cf910c", machines = ["studio"] }
"glm-4.7-flash:bf16"      = { digest = "b0f42cc1a61283c9173423ba0a0f4fb7b6b5cc8d520a09037d28e0956eb24f34", machines = ["studio"] }   # every experiment (D61, D64); GGUF, reported as F16
"nemotron-3-nano:30b"     = { digest = "b725f11174073334edd0c2ff396b8d4e66d7dab22a5a63717ccad5a08a270cf1", machines = ["studio"] }
"devstral-small-2:24b"    = { digest = "33af3142213a8f079412a71bb6a9759c35f5adf448c9d6d27e3994cde07679c8", machines = ["studio", "laptop", "beelink"] }
"llama3:8b"               = { digest = "365c0bd3c000a25d28ddbf732fe1c6add414de7275464c4e4d1c3b5fcb5d8ad1", machines = ["studio"] }
"gpt-oss:20b-date20261010"  = { digest = "41bf45e8998c34516dd702276336c7bb22a17278e53806194046bbc0afef8323", machines = ["studio", "laptop", "beelink"] }   # gpt-oss:20b f38aa0c53da5 with the date fixed ([date]); built on each machine FROM its own copy of weights blob 8ecb5d4a (a FROM gpt-oss:20b build duplicates the licence layer and gets another digest)
"gpt-oss:120b-date20261010" = { digest = "6ae9cf77adc26e87b2151eba939358a0f37d608420abeb06c11782811d44bcb4", machines = ["studio"] }   # gpt-oss:120b ad84bf7720de with the date fixed
"qwen3-coder:30b"         = { digest = "06c1097efce0431c2045fe7b2e5108366e43bee1b4603a7aded8f21689e90bca", machines = ["studio", "laptop", "beelink"] }
"qwen3-coder-next:q4_K_M" = { digest = "530048d6faa07d7fde270ea7e4a7f6a22680c98a0ca55d39553493af5ade4aa4", machines = ["studio"] }
"qwen3.5:122b"            = { digest = "b48ba378786285c5bf74134fda36f02dcc0025ac52d1aafe0e4fc2ce87a3b391", machines = ["studio"] }
"deepseek-r1:70b"         = { digest = "0d0d6964cbff0648077e2ac5ec58a738186a6128e282d15a11286d8b47c87cf3", machines = ["studio"] }
"bge-m3:latest"           = { digest = "7907646426070047a77226ac3e684fbbe8410524f7b4a74d02837e43f2146bab", machines = ["studio", "laptop", "beelink"] }
"olmo-3.1:32b-think"      = { digest = "223d4ec84d916f02f72dffc016ac4b41748d6d02d61b0c2d098e9d7861046ed2", machines = ["beelink"] }   # Q4_K_M, pulled 16 October for T3 (D77); the same digest as olmo-3.1:32b on the Ollama library
"qwen3.8:27b"             = { digest = "aaee06c39dcf2437cde036998d960e1fc1494b8191be7cc9657d01e509097813", machines = ["beelink"] }   # D85: the second judge, GGUF Q4_K_M, 27.3B, runner llamacpp, context 262,144 (/api/tags and /api/show on the Beelink, 17 October); the Studio's qwen3.8:27b is the MLX build 47951e4a6661, which D47 keeps out of every run
# Not runnable, by decision: qwen3.5:35b (dropped, D77); olmo-3:32b (replaced by olmo-3.1:32b-think, D77).

[text]
passages = "whole"
judge_input = "whole"
stored_text = "whole"
scorer_input = "whole"         # an encoder with a fixed limit (bge-m3 8,192 tokens) splits the text, never cuts it
component_cuts = "removed"     # except a view the model asks for itself (an RLM printing a preview)
rerank = "all strategies"      # the RLM included

[record]
# Every call writes these; local calls also keep the server's own timings and how busy the machine was.
fields = ["options_sent", "stop_reason", "prompt_tokens", "output_tokens", "model_digest",
          "server", "ollama_version", "wall_s", "load_s", "prompt_eval_s", "eval_s",
          "busy_servers_on_machine", "passages", "lock_sha256"]
